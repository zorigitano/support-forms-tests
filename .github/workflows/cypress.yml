name: Cypress

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      state:
        description: State name or value
        required: true
        type: string
      formGroup:
        description: Exact form section label
        required: true
        type: string

jobs:
  cypress:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        spec:
          - cypress/e2e/support-forms-beneficiary.cy.js
          - cypress/e2e/support-forms-individual-policyholder.cy.js
          - cypress/e2e/support-forms-plan-administrator.cy.js
          - cypress/e2e/support-forms-plan-member.cy.js
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Cypress binary
        run: npx cypress install

      - name: Run Cypress spec
        env:
          CYPRESS_STATE: ${{ inputs.state }}
          CYPRESS_FORM_GROUP: ${{ inputs.formGroup }}
        run: npx cypress run --spec "${{ matrix.spec }}" --env "state=$CYPRESS_STATE,formGroup=$CYPRESS_FORM_GROUP"