name: Support Forms Test for Broken Links

on:
  workflow_dispatch:
    inputs:
      policyholderType:
        description: Policyholder type
        required: true
        type: choice
        default: Beneficiary
        options:
          - Beneficiary
          - Individual Policyholder
          - Plan Administrator
          - Plan Member
      state:
        description: State
        required: true
        type: choice
        default: Alabama
        options:
          - Alabama
          - Alaska
          - Arizona
          - Arkansas
          - California
          - Colorado
          - Connecticut
          - Delaware
          - District of Columbia
          - Florida
          - Georgia
          - Hawaii
          - Idaho
          - Illinois
          - Indiana
          - Iowa
          - Kansas
          - Kentucky
          - Louisiana
          - Maine
          - Maryland
          - Massachusetts
          - Michigan
          - Minnesota
          - Mississippi
          - Missouri
          - Montana
          - Nebraska
          - Nevada
          - New Hampshire
          - New Jersey
          - New Mexico
          - New York
          - North Carolina
          - North Dakota
          - Ohio
          - Oklahoma
          - Oregon
          - Pennsylvania
          - Rhode Island
          - South Carolina
          - South Dakota
          - Tennessee
          - Texas
          - Utah
          - Vermont
          - Virgin Islands
          - Virginia
          - Washington
          - West Virginia
          - Wisconsin
          - Wyoming
      formGroup:
        description: Form group
        required: false
        type: string

jobs:
  cypress:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        batch: ${{ fromJSON(inputs.state && '[0]' || '[0,1,2,3,4]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Cypress binary
        run: npx cypress install

      - name: Check state batching
        if: ${{ matrix.batch == 0 }}
        run: npx cypress run --spec cypress/e2e/support-forms-batching.cy.js

      - name: Discover form links
        env:
          SUPPORT_FORMS_STATE: ${{ inputs.state }}
          CYPRESS_FORM_GROUP: ${{ inputs.formGroup }}
          POLICYHOLDER_TYPE: ${{ inputs.policyholderType }}
        run: npx cypress run --spec cypress/e2e/support-forms.cy.js --env "policyholderType=$POLICYHOLDER_TYPE,formGroup=$CYPRESS_FORM_GROUP,stateBatch=${{ matrix.batch }},stateBatchCount=5"

      - name: Test form links
        env:
          SUPPORT_FORMS_CHECK_LINKS: '1'
        run: npx cypress run --spec cypress/e2e/support-form-links.cy.js

      - name: Upload npm debug logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-logs-${{ strategy.job-index }}
          path: ~/.npm/_logs/*-debug-0.log
          if-no-files-found: ignore