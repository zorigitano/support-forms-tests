name: Cypress

on:
  workflow_dispatch:
    inputs:
      policyholderType:
        description: Policyholder type
        required: false
        type: choice
        default: All
        options:
          - All
          - Beneficiary
          - Individual Policyholder
          - Plan Administrator
          - Plan Member
      state:
        description: State name or value
        required: false
        type: string
      formGroup:
        description: Exact form section label
        required: false
        type: string

jobs:
  cypress:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        batch: ${{ fromJSON(inputs.state && '[0]' || '[0,1,2,3,4]') }}
        policyholderType: ${{ fromJSON(inputs.policyholderType && inputs.policyholderType != 'All' && format('[{0}]', toJSON(inputs.policyholderType)) || '["Beneficiary", "Individual Policyholder", "Plan Administrator", "Plan Member"]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Cypress binary
        run: npx cypress install

      - name: Check state batching
        if: ${{ matrix.batch == 0 && matrix.policyholderType == (inputs.policyholderType && inputs.policyholderType != 'All' && inputs.policyholderType || 'Beneficiary') }}
        run: npx cypress run --spec cypress/e2e/support-forms-batching.cy.js

      - name: Run Cypress spec
        env:
          CYPRESS_STATE: ${{ inputs.state }}
          CYPRESS_FORM_GROUP: ${{ inputs.formGroup }}
          POLICYHOLDER_TYPE: ${{ matrix.policyholderType }}
        run: npx cypress run --spec cypress/e2e/support-forms.cy.js --env "policyholderType=$POLICYHOLDER_TYPE,state=$CYPRESS_STATE,formGroup=$CYPRESS_FORM_GROUP,stateBatch=${{ matrix.batch }},stateBatchCount=5"

      - name: Upload npm debug logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-logs-${{ strategy.job-index }}
          path: ~/.npm/_logs/*-debug-0.log
          if-no-files-found: ignore